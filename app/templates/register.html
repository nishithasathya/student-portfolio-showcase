
{% extends "base.html" %}

{% block title %}Register — Student Portfolio Showcase{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">STUDENT PORTFOLIO SHOWCASE</p>
    <h1>Create your account</h1>
    <p class="auth-subtitle">Start building and sharing your portfolio.</p>

    <form id="register-form" novalidate>
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
        autocomplete="email"
      />

      <label for="display_name">Display name</label>
      <input
        type="text"
        id="display_name"
        name="display_name"
        placeholder="Your full name"
        required
        maxlength="120"
        autocomplete="name"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Minimum 8 characters"
        required
        minlength="8"
        autocomplete="new-password"
      />

      <p id="register-message" class="message" hidden></p>
      <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</section>
{% endblock %}
